[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pysheets"
version = "0.3.3"
description = "A fast desktop spreadsheet for millions of rows, powered by DuckDB."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "duckdb>=1.5.6",
    "google-auth>=2.62.1",
    "google-auth-oauthlib>=1.5.0",
    "pandas>=2.3.3",
    "pyarrow>=25.0.1",
    "python-calamine>=0.8.3",
    "requests>=2.34.2",
    "rustpy-xlsxwriter>=0.8.2",
    "xlsxwriter>=3.3.1",
]

[project.scripts]
pysheets = "pysheets.cli:main"

[project.optional-dependencies]
desktop = [
    "pywebview>=6.2.1",
]
sql = [
    "sqlalchemy>=2.0.57",
]
# libraries commonly imported by ported Google Sheets / reporting scripts (bundled in the Windows build)
scripts = [
    "gspread>=6.1",
    "gspread-dataframe>=4.0",
    "openpyxl>=3.1",
    "tqdm>=4.66",
]

[dependency-groups]
build = ["pyinstaller>=6.10"]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pysheets"]
# the built UI is git-ignored but must ship inside the wheel
artifacts = ["src/pysheets/web/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B023"]
