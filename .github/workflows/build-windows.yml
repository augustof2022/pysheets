name: Windows app

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release and create this tag (e.g. v0.3.0). Leave empty for a test build."
        required: false
        default: ""
  push:
    branches: ["**"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build UI
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: uv sync --all-extras --group build

      - name: Freeze with PyInstaller
        run: uv run pyinstaller packaging/pysheets.spec --noconfirm --clean

      - name: Smoke test the frozen app
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\PySheets\PySheets.exe -ArgumentList "--serve","--port","8799" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 40 -and -not $ok; $i++) {
            Start-Sleep -Milliseconds 500
            try { $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8799/; $ok = $r.Content -match "__PYSHEETS__" } catch {}
          }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { throw "frozen app did not serve the UI" }
          Write-Host "Frozen app serves the UI"

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = (uv run python -c "import pysheets; print(pysheets.__version__)").Trim()
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging\installer.iss
          Compress-Archive -Path dist\PySheets -DestinationPath "dist\PySheets-$version-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: PySheets-windows
          path: |
            dist/PySheets-Setup-*.exe
            dist/PySheets-*-windows-x64.zip
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release || github.ref_name }}
          name: PySheets ${{ inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/PySheets-Setup-*.exe
            dist/PySheets-*-windows-x64.zip
